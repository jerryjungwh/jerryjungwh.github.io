name: deploy

# Every push to main is checked and published to GitHub Pages.
# This publishes the public build: search engines are allowed in, and the build fails
# if any placeholder screen is left (see src/lib/release.ts).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Set the "last updated" date
        run: echo "SITE_UPDATED=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_ENV"
      - name: Check and build
        run: npm run build:release
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
